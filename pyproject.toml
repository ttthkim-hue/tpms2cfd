[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpms2cfd"
version = "1.0.0"
description = "Dual-track analytic B-Rep and watertight implicit Sheet-TPMS CAD-to-CFD geometry synthesis and quality auditing toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "trimesh>=4.0",
    "manifold3d>=2.4",
    "gmsh>=4.12",
    "cadquery-ocp>=7.7",
]

[project.scripts]
tpms2cfd = "tpms2cfd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
